name: Compatibility

on:
  push:
    branches: [main]
    paths:
      - packages/*/src/**
      - consumers/**
      - scripts/consumers/**
      - scripts/sources/**
      - packages/*/package.json
      - packages/*/tsdown.config.ts
      - packages/*/tsconfig*.json
      - compat/**
      - .github/workflows/compat.yml
      - package.json
      - pnpm-lock.yaml
      - tsconfig.base.json
  pull_request:
    paths:
      - packages/*/src/**
      - consumers/**
      - scripts/consumers/**
      - scripts/sources/**
      - packages/*/package.json
      - packages/*/tsdown.config.ts
      - packages/*/tsconfig*.json
      - compat/**
      - .github/workflows/compat.yml
      - package.json
      - pnpm-lock.yaml
      - tsconfig.base.json

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: Pack the packages
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.versions.outputs.node }}
      versions: ${{ steps.versions.outputs.versions }}
      typescript: ${{ steps.versions.outputs.typescript }}
      react-native: ${{ steps.versions.outputs.react-native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build
      # pnpm pack turns workspace:^ dependencies into version ranges.
      - run: pnpm --filter "./packages/*" pack --pack-destination "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          if-no-files-found: error
      - name: Read the versions to check
        id: versions
        run: |
          echo "versions=$(jq -c . compat/versions.json)" >> "$GITHUB_OUTPUT"
          echo "node=$(jq -c '[.node] + .nodeRequire + ["lts/*"]' compat/versions.json)" >> "$GITHUB_OUTPUT"
          echo "typescript=$(jq -r .devDependencies.typescript package.json)" >> "$GITHUB_OUTPUT"
          oldest="$(jq -r '.peerDependencies["react-native"] | ltrimstr(">=")' packages/native-recipe/package.json)"
          echo "react-native=$(jq -c --arg oldest "$oldest" '[$oldest, .dependencies["react-native"]]' consumers/native-recipe/package.json)" >> "$GITHUB_OUTPUT"

  node:
    name: Node.js ${{ matrix.node }}
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.pack.outputs.node) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - name: Install the packed packages
        run: &install |
          for tarball in "$RUNNER_TEMP"/packages/*.tgz; do
            name="$(basename "$tarball" | sed -E 's/^lynstack-(.*)-[0-9]+\.[0-9]+\.[0-9]+\.tgz$/\1/')"
            mkdir -p "compat/node_modules/@lynstack/$name"
            tar -xzf "$tarball" -C "compat/node_modules/@lynstack/$name" --strip-components=1
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Import the packages
        working-directory: compat
        run: node smoke.mjs
      - name: Require the packages
        if: matrix.node != fromJSON(needs.pack.outputs.versions).node
        working-directory: compat
        run: node smoke.cjs

  bun:
    name: Bun ${{ matrix.bun }}
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun:
          - ${{ fromJSON(needs.pack.outputs.versions).bun }}
          - latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - name: Install the packed packages
        run: *install
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
      - name: Import the packages
        working-directory: compat
        run: bun smoke.mjs
      - name: Require the packages
        working-directory: compat
        run: bun smoke.cjs

  deno:
    name: Deno ${{ matrix.deno }}
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deno:
          - ${{ fromJSON(needs.pack.outputs.versions).deno }}
          - latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - name: Install the packed packages
        run: *install
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno }}
      - name: Import the packages
        working-directory: compat
        run: deno run smoke.mjs

  sources:
    name: Package sources on TypeScript ${{ fromJSON(needs.pack.outputs.versions).typescript }}
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      # Builds the packages, then compiles each one's sources, tests, and
      # benchmarks with the oldest TypeScript that the packages support.
      - name: Compile the sources of the packages
        env:
          TYPESCRIPT: ${{ fromJSON(needs.pack.outputs.versions).typescript }}
        run: pnpm sources --typescript "$TYPESCRIPT"

  typescript:
    name: TypeScript ${{ matrix.typescript }}, React Native ${{ matrix.react-native }}
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript:
          - ${{ fromJSON(needs.pack.outputs.versions).typescript }}
          - ${{ needs.pack.outputs.typescript }}
        react-native: ${{ fromJSON(needs.pack.outputs.react-native) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: false
      # Installs the packed packages in each app of consumers, outside the
      # repository, as an app installs them from npm, and compiles it.
      - name: Compile the apps that install the packages
        env:
          TYPESCRIPT: ${{ matrix.typescript }}
          REACT_NATIVE: ${{ matrix.react-native }}
        run: >-
          node scripts/consumers/main.ts
          --packages "$RUNNER_TEMP/packages"
          --typescript "$TYPESCRIPT"
          --react-native "$REACT_NATIVE"
