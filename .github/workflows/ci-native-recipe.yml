name: CI @lynstack/native-recipe

on:
  push:
    branches: [main]
    paths:
      - packages/native-recipe/**
      - consumers/native-recipe/**
      - packages/recipe/**
      - .github/workflows/ci-native-recipe.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .oxlintrc.json
      - .prettierrc.json
      - .prettierignore
  pull_request:
    paths:
      - packages/native-recipe/**
      - consumers/native-recipe/**
      - packages/recipe/**
      - .github/workflows/ci-native-recipe.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .oxlintrc.json
      - .prettierrc.json
      - .prettierignore

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      # The package depends on the built @lynstack/recipe.
      - run: pnpm --filter @lynstack/recipe build
      - run: pnpm --filter @lynstack/native-recipe --filter native-recipe-consumer check
